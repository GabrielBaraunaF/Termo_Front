<p class="title">Oponente digitando</p>

<div class="dots" aria-hidden="true">
  @for (filled of dots(); track $index) {
    <img
      [src]="filled ? 'assets/icons/typing-dot-on.svg' : 'assets/icons/typing-dot-off.svg'"
      width="14"
      height="14"
      alt=""
    />
  }
</div>

<p class="caption" aria-live="polite">
  {{ letters() }} de {{ max }} letras · só a contagem é enviada, nunca as letras
</p>
